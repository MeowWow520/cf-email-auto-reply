name = "email-auto-reply"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[vars]
# 接收邮件的地址，Worker 只对该地址的来信自动回复
REPLY_ADDRESS = "e-mail@meowwow520.cn"
# 回复邮件的发件人显示名
REPLY_FROM_NAME = "[Auto Reply] MeowWow520"
# 回复邮件主题模板（支持 {{subject}} 占位符，默认 "Re: {{subject}}"）
# REPLY_SUBJECT = "Re: {{subject}}"

# 纯文本回复模板（支持 {{from}} / {{subject}} 占位符）
REPLY_TEXT = """
Hello {{from}},

Thank you for your email. I will reply soon.

Best regards
"""

# 自动回复后，将原邮件转发到该地址（留空则不转发）
# 注意：该地址需先在 Email Routing 的 Destination addresses 中验证
FORWARD_TO = "Meow114514@outlook.com"
